name: 日历数据修正
description: 报告法定班休、传统节日或节气的日期与语义问题
title: "[数据] "
labels:
  - calendar-data
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        正式班休只接受国务院办公厅正式通知作为最终依据。媒体报道和第三方日历可作为线索，但不能替代权威来源。

  - type: dropdown
    id: feed
    attributes:
      label: 受影响的订阅
      options:
        - 中国日历・精选（essential.ics）
        - 中国班休（work-rest.ics）
        - 两个订阅都受影响
        - 暂不确定
    validations:
      required: true

  - type: input
    id: event
    attributes:
      label: 事件名称
      description: 填写日历中看到的完整标题。
      placeholder: 例如：休｜国庆节、中秋节、立冬
    validations:
      required: true

  - type: input
    id: dates
    attributes:
      label: 受影响日期
      description: 使用明确的公历日期或日期范围。
      placeholder: 例如：2026-10-01 至 2026-10-07
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 当前结果
      description: 说明目前显示的日期、标题、类型或重复情况。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 说明应如何修正，以及对现有事件的影响。
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: 权威来源
      description: 法定班休请提供 gov.cn 正式通知；其他内容请提供可长期核验的历法或机构来源。
      placeholder: https://www.gov.cn/...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可附脱敏截图、相关事件 UID 或其他核对线索。请勿公开个人日程。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同报告。
          required: true
        - label: 我已检查是否同时订阅多个综合日历源，并在上文说明结果。
          required: true
        - label: 我提供的截图和文本不含个人日程、账户信息或其他敏感数据。
          required: true
