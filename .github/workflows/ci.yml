name: Verify calendars

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint and format check
        run: |
          ruff check src tests
          ruff format --check src tests
          node --check site/app.js
          node --check worker/src/index.mjs
          node tests/test_worker.mjs
      - name: Generate calendars
        run: calendar-build
      - name: Validate calendars
        run: calendar-validate dist
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify committed output is current
        run: |
          git diff --exit-code -- dist
          untracked=$(git ls-files --others --exclude-standard dist)
          if [ -n "$untracked" ]; then
            printf 'Untracked generated files:\n%s\n' "$untracked"
            exit 1
          fi
