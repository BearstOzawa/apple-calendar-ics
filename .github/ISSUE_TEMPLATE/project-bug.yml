name: 网站或项目故障
description: 报告订阅页面、构建、校验或 GitHub Actions 的可复现问题
title: "[故障] "
labels:
  - bug
  - needs-triage
body:
  - type: dropdown
    id: area
    attributes:
      label: 受影响部分
      options:
        - GitHub Pages 订阅页面
        - ICS 构建或校验
        - GitHub Actions
        - 上游差异监测
        - 开发环境或命令行工具
        - 其他
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 说明发生了什么，并附上完整、已脱敏的错误信息。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 使用提交或页面版本……
        2. 运行或打开……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 提供页面 URL、manifest 版本、Commit SHA 或分支名称。
      placeholder: 例如：main@1b4be41
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 按需提供操作系统、Python、Node.js 和浏览器版本。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已在当前默认分支或线上页面复现，并搜索过现有 Issue。
          required: true
        - label: 日志和截图中不含访问令牌、账户信息或个人日程。
          required: true
