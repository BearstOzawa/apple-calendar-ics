name: Monitor official calendar candidates

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compare reviewed data with candidate upstream
        id: compare
        run: |
          set +e
          calendar-check-upstream
          monitor_exit=$?
          set -e
          if [ "$monitor_exit" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$monitor_exit" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            exit "$monitor_exit"
          fi
      - name: Create or update review pull request
        if: steps.compare.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: automation/source-monitor
        run: |
          git fetch origin "$REVIEW_BRANCH:refs/remotes/origin/$REVIEW_BRANCH" || true
          git switch -C "$REVIEW_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/upstream-diff.json
          git commit -m "chore(data): report upstream calendar changes"
          git push --force-with-lease origin "HEAD:$REVIEW_BRANCH"

          pr_number=$(gh pr list --head "$REVIEW_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head "$REVIEW_BRANCH" \
              --title "chore(data): review upstream calendar changes" \
              --body "检测到候选班休数据变化。请先核对报告中的国务院正式通知，再人工更新 data/official；不要直接发布候选数据。"
          fi
