name: Auto-sync official calendar updates

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cloudflare-workers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Sync official holiday updates from upstream
        id: sync
        run: |
          calendar-check-upstream --apply
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REVIEW_BRANCH="automation/official-sync"
          if git fetch origin "$REVIEW_BRANCH:refs/remotes/origin/$REVIEW_BRANCH" 2>/dev/null; then
            git add -N data/
            if git diff --quiet "remotes/origin/$REVIEW_BRANCH" -- data/; then
              echo "Data matches existing $REVIEW_BRANCH branch; already deployed."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild and validate all calendars
        if: steps.sync.outputs.changed == 'true'
        run: |
          calendar-build
          calendar-validate dist
          node --check site/app.js
          node --check site/calendar-core.js
          node --check site/qrcode.js
          node --check worker/src/index.mjs
          node tests/test_calendar_core.mjs
          node tests/test_worker.mjs
          python -m unittest discover -s tests -v

      - name: Deploy updated calendars to Cloudflare Workers
        if: steps.sync.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp dist/*.ics dist/manifest.json dist/dense-preview.json _site/
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 未配置，跳过线上自动部署。"
            exit 0
          fi
          npx --yes wrangler@4.124.0 deploy --config worker/wrangler.jsonc

      - name: Archive synced data via pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: automation/official-sync
        run: |
          git switch -C "$REVIEW_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ dist/
          git commit -m "chore(data): auto-sync official holiday schedule"
          git push --force-with-lease origin "HEAD:$REVIEW_BRANCH"

          pr_number=$(gh pr list --head "$REVIEW_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            gh pr create \
              --base main \
              --head "$REVIEW_BRANCH" \
              --title "chore(data): 自动同步最新国务院节假日安排" \
              --body "已自动抓取并校验国务院正式节假日通知，全套 ICS 与页面预览已完成验证并自动发布上线；合并此 PR 即可归档至 main。"
          fi
