name: 功能建议
description: 提议新的订阅频道、内容范围、页面能力或维护机制
title: "[建议] "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 从用户场景出发说明当前体验缺少什么，不要只描述一个功能名称。
    validations:
      required: true

  - type: input
    id: audience
    attributes:
      label: 目标用户
      placeholder: 例如：需要区分法定班休与传统节日的 Apple 日历用户
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 建议范围
      options:
        - 新的独立订阅频道
        - 现有订阅内容或语义
        - 本地个人日历工具
        - 订阅页面与安装体验
        - 数据治理、校验或发布机制
        - 暂不确定
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明内容边界、交互或预期结果，并考虑如何避免重复和干扰。
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 数据来源与长期维护
      description: 若涉及新日历内容，请说明权威来源、更新频率、地域或人群边界。

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明现有 Apple 日历、其他订阅源或组合方式为何不能满足需求。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和路线图，确认没有相同建议。
          required: true
        - label: 我已说明该建议如何控制重复、噪声和后续维护成本。
          required: true
