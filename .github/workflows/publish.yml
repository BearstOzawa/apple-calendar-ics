name: Publish calendars

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Build and verify
        run: |
          calendar-build
          calendar-validate dist
          node --check site/app.js
          node --check site/calendar-core.js
          node --check site/qrcode.js
          node --check worker/src/index.mjs
          node tests/test_calendar_core.mjs
          node tests/test_worker.mjs
          python -m unittest discover -s tests -v
      - name: Stage Cloudflare Worker assets
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp dist/*.ics dist/manifest.json dist/dense-preview.json _site/
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN 未配置，已跳过自动推送；可在仓库 Secrets 配置后启用自动部署。"
            exit 0
          fi
          npx --yes wrangler@4.124.0 deploy --config worker/wrangler.jsonc
